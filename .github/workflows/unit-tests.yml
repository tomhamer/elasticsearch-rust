name: unit-tests

# Library (unit) tests for every workspace crate. Run on demand from the
# Actions tab or with `gh workflow run unit-tests.yml --ref <branch>`.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (a larger or self-hosted Linux runner is recommended)"
        default: ubuntu-latest
      packages:
        description: "Space-separated packages to test (empty: whole workspace)"
        default: ""

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        shell: bash
        run: |
          if [ -n "${{ inputs.packages }}" ]; then
            args=""; for p in ${{ inputs.packages }}; do args="$args -p $p"; done
          else
            args="--workspace --exclude es-path-poc"
          fi
          cargo test --locked --profile fast $args --lib
