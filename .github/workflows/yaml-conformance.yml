name: yaml-conformance

# Runs Elasticsearch 9.5.5's own YAML REST test suite against the engine.
# Run on demand from the Actions tab or with
# `gh workflow run yaml-conformance.yml --ref <branch>`.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (a larger or self-hosted Linux runner is recommended)"
        default: ubuntu-latest
      suite:
        description: "Which suite to run"
        type: choice
        options: [core, xpack, security]
        default: core
      filter:
        description: "Optional directory or path substring to run (empty: all)"
        default: ""
      jobs:
        description: "Parallel test files"
        default: "4"

concurrency:
  group: yaml-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the ES 9.5.5 YAML suite
        run: tests/es-yaml/fetch.sh
      - name: Build the YAML runner
        run: cargo build --locked --profile fast -p es-yaml-runner
      - name: Run the suite
        shell: bash
        run: |
          args="--jobs ${{ inputs.jobs }} --report yaml-report.md --json yaml-report.json"
          case "${{ inputs.suite }}" in
            xpack) args="$args --xpack" ;;
            security) args="$args --security" ;;
          esac
          if [ -n "${{ inputs.filter }}" ]; then args="$args --filter ${{ inputs.filter }}"; fi
          target/fast/es-yaml-runner $args
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yaml-report-${{ inputs.suite }}
          path: yaml-report.*
