[package]
name = "es-cluster-yaml"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runs Elasticsearch's YAML REST test suite against an external (multi-node) cluster, reusing es-yaml-runner's executor."
publish = false
build = "build.rs"

[dependencies]
# The copied exec.rs also builds in-process servers (unused here) and
# references the engine directly.
elasticsearch-engine.workspace = true
elasticsearch-http.workspace = true
base64.workspace = true
tokio.workspace = true
reqwest = { workspace = true, features = ["rustls-tls"] }
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
serde_yaml.workspace = true
chrono.workspace = true
regex = "1"
