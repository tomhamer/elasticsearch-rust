{{- $root := . -}}
{{- $cluster := include "es.clusterName" . -}}
{{- range .Values.nodeGroups }}
{{- $g := include "es.group" (dict "root" $root "group" .) | fromYaml }}
{{- $name := include "es.groupFullname" (dict "root" $root "group" $g) }}
{{- $esConfig := include "es.groupConfig" (dict "root" $root "group" $g) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "es.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $g.name }}
data:
  elasticsearch.yml: |
    # Generated by the elasticsearch Helm chart (values: config + nodeGroups[{{ $g.name }}].config).
    # cluster.name, node.name, node.roles, network.*, discovery.seed_hosts and
    # cluster.initial_master_nodes are passed through the environment.
    {{- if $esConfig }}
    {{- $esConfig | nindent 4 }}
    {{- end }}
{{- end }}
---
# cluster.initial_master_nodes for the first bootstrap only (see
# `clusterBootstrapped` in values.yaml). Mounted into master-eligible pods at
# /usr/share/elasticsearch/settings.d/bootstrap; it is not part of the pod
# template, so emptying it does not restart anything.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $cluster }}-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "es.labels" . | nindent 4 }}
data:
  {{- if include "es.bootstrapped" . }}
  {}
  {{- else }}
  cluster.initial_master_nodes: {{ include "es.initialMasterNodes" . | quote }}
  {{- end }}
