{{- $cluster := include "es.clusterName" . }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ $cluster }}-test-cluster-health
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "es.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    # Keep the finished pod so `helm test --logs` can read it; the next
    # `helm test` replaces it.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: health
      image: {{ include "es.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      env:
        {{- include "es.clientEnv" . | trim | nindent 8 }}
      {{- with include "es.clientCaMount" . }}
      volumeMounts:
        {{- . | trim | nindent 8 }}
      {{- end }}
      command:
        - bash
        - -euo
        - pipefail
        - -c
        - |
          . /usr/share/elasticsearch/bin/es-http-lib
          echo "waiting for cluster health {{ .Values.tests.waitForStatus }} at ${ES_URL}"
          out="$(es_curl -sS --max-time 150 "${ES_URL}/_cluster/health?wait_for_status={{ .Values.tests.waitForStatus }}&timeout={{ .Values.tests.timeout }}")"
          echo "$out"
          [ "$(jq -r .timed_out <<< "$out")" = "false" ]
          [ "$(jq -r .cluster_name <<< "$out")" = "{{ $cluster }}" ]
          echo "cluster is {{ .Values.tests.waitForStatus }}"
          {{- if .Values.security.enabled }}
          # Security is enforced: no credentials -> 401.
          code="$(ES_PASSWORD= ELASTIC_PASSWORD= es_curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${ES_URL}/_cluster/health")"
          echo "anonymous request -> HTTP ${code}"
          [ "$code" = 401 ]
          {{- end }}
  {{- with include "es.clientCaVolume" . }}
  volumes:
    {{- . | trim | nindent 4 }}
  {{- end }}
