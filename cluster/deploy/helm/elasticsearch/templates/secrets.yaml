{{- if .Values.security.enabled }}
{{- $cluster := include "es.clusterName" . }}
{{- if not .Values.security.elasticPassword.existingSecret }}
{{- $name := printf "%s-credentials" $cluster }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
# Password of the `elastic` superuser (the node's bootstrap password).
# Generated once; `helm upgrade` keeps it.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "es.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ "elastic" | b64enc }}
  {{- if and $existing $existing.data (hasKey $existing.data "password") }}
  password: {{ index $existing.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 24 | b64enc }}
  {{- end }}
{{- end }}
{{- if include "es.certsGenerated" . }}
{{- $name := printf "%s-certs" $cluster }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
---
# CA, HTTP and transport certificates generated by the chart (provider:
# generate). `helm upgrade` keeps them; delete this Secret and upgrade to
# issue new ones (the nodes reload changed certificate files).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "es.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if and $existing $existing.data (hasKey $existing.data "transport.key") (hasKey $existing.data "http.key") }}
  {{- range $k := list "ca.crt" "http.crt" "http.key" "transport.crt" "transport.key" }}
  {{ $k }}: {{ index $existing.data $k }}
  {{- end }}
  {{- else }}
  {{- $g := .Values.security.tls.generate }}
  {{- $ca := genCA (printf "%s Elasticsearch CA" $cluster) (int $g.caDays) }}
  {{- $dns := include "es.httpDnsNames" . | fromJsonArray }}
  {{- $ips := include "es.httpIPs" . | fromJsonArray }}
  {{- $http := genSignedCert (include "es.serviceHost" .) $ips $dns (int $g.certDays) $ca }}
  {{- $transport := genSignedCert (printf "%s-transport" $cluster) $ips $dns (int $g.certDays) $ca }}
  ca.crt: {{ $ca.Cert | b64enc }}
  http.crt: {{ $http.Cert | b64enc }}
  http.key: {{ $http.Key | b64enc }}
  transport.crt: {{ $transport.Cert | b64enc }}
  transport.key: {{ $transport.Key | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
