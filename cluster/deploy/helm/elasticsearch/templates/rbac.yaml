{{- if .Values.rbac.create }}
{{- $cluster := include "es.clusterName" . }}
# preStop (es-prestop) reads its StatefulSet's spec.replicas to tell a
# scale-down from a restart.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $cluster }}-elasticsearch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "es.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $cluster }}-elasticsearch
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "es.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $cluster }}-elasticsearch
subjects:
  - kind: ServiceAccount
    name: {{ include "es.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.zoneAwareness.enabled }}
---
# es-zone-init reads the scheduled node's topology label.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ $cluster }}-node-reader
  labels:
    {{- include "es.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ $cluster }}-node-reader
  labels:
    {{- include "es.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ $cluster }}-node-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "es.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
