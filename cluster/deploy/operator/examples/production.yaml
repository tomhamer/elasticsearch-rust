# Dedicated masters + data nodes spread over three zones with shard
# allocation awareness. Zone attributes come from the Kubernetes node label
# topology.kubernetes.io/zone via the image's es-zone-init helper, which
# needs `get nodes` (ServiceAccount + ClusterRole below).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prod-es
  namespace: search
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: search-prod-es-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: search-prod-es-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: search-prod-es-node-reader
subjects:
  - kind: ServiceAccount
    name: prod-es
    namespace: search
---
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: prod
  namespace: search
spec:
  version: 0.1.0
  updateStrategy:
    changeBudget:
      maxSurge: 1
      maxUnavailable: 1
  nodeSets:
    - name: master
      count: 3
      config:
        node.roles: [master]
        cluster.routing.allocation.awareness.attributes: zone
      podTemplate:
        spec:
          serviceAccountName: prod-es
          initContainers:
            - name: zone-attribute
              image: elasticsearch-rs:0.1.0
              command: ["/usr/share/elasticsearch/bin/es-zone-init"]
              env:
                - name: NODE_NAME
                  valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
              volumeMounts:
                - { name: node-attributes, mountPath: /usr/share/elasticsearch/settings.d/attrs }
          containers:
            - name: elasticsearch
              resources:
                requests: { cpu: "1", memory: 2Gi }
                limits: { memory: 2Gi }
              volumeMounts:
                - { name: node-attributes, mountPath: /usr/share/elasticsearch/settings.d/attrs, readOnly: true }
          volumes:
            - name: node-attributes
              emptyDir: {}
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  elasticsearch.k8s.elastic.co/cluster-name: prod
                  elasticsearch.k8s.elastic.co/statefulset-name: prod-es-master
      volumeClaimTemplates:
        - metadata: { name: elasticsearch-data }
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: fast-ssd
            resources: { requests: { storage: 10Gi } }

    - name: data
      count: 6
      config:
        node.roles: [data, ingest]
        cluster.routing.allocation.awareness.attributes: zone
      podTemplate:
        spec:
          serviceAccountName: prod-es
          initContainers:
            - name: zone-attribute
              image: elasticsearch-rs:0.1.0
              command: ["/usr/share/elasticsearch/bin/es-zone-init"]
              env:
                - name: NODE_NAME
                  valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
              volumeMounts:
                - { name: node-attributes, mountPath: /usr/share/elasticsearch/settings.d/attrs }
          containers:
            - name: elasticsearch
              resources:
                requests: { cpu: "4", memory: 32Gi }
                limits: { memory: 32Gi }
              volumeMounts:
                - { name: node-attributes, mountPath: /usr/share/elasticsearch/settings.d/attrs, readOnly: true }
          volumes:
            - name: node-attributes
              emptyDir: {}
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  elasticsearch.k8s.elastic.co/cluster-name: prod
                  elasticsearch.k8s.elastic.co/statefulset-name: prod-es-data
      volumeClaimTemplates:
        - metadata: { name: elasticsearch-data }
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: fast-ssd
            resources: { requests: { storage: 500Gi } }
