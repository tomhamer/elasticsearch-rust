# Three-node elasticsearch cluster, mirroring Elastic's documented
# docker-compose example without the certificate setup service and Kibana
# (security is turned off with xpack.security.enabled=false).
#
#   cd cluster/deploy/docker
#   docker compose up -d --build      # builds the image from the repo root
#   curl localhost:9200/_cat/nodes?v
#   docker compose down               # keep data;  `down -v` deletes the volumes
#
# Tunables (environment or a .env file next to this file):
#   ES_IMAGE (default elasticsearch-rs:dev), CLUSTER_NAME, ES_PORT, MEM_LIMIT
name: elasticsearch

x-es-node: &es-node
  image: ${ES_IMAGE:-elasticsearch-rs:dev}
  build:
    context: ../../..
    dockerfile: cluster/deploy/docker/Dockerfile
  restart: unless-stopped
  mem_limit: ${MEM_LIMIT:-2g}
  ulimits:
    nofile: { soft: 65535, hard: 65535 }
    # Lets `bootstrap.memory_lock=true` succeed, as in ES's compose example.
    memlock: { soft: -1, hard: -1 }
  stop_grace_period: 2m
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS --max-time 4 'http://127.0.0.1:9200/_cluster/health?local=true' >/dev/null"]
    interval: 10s
    timeout: 5s
    start_period: 60s
    retries: 12

services:
  es01:
    <<: *es-node
    container_name: es01
    hostname: es01
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    environment:
      - node.name=es01
      - cluster.name=${CLUSTER_NAME:-docker-cluster}
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_hosts=es02,es03
      - xpack.security.enabled=false

  es02:
    <<: *es-node
    container_name: es02
    hostname: es02
    depends_on: [es01]
    volumes:
      - esdata02:/usr/share/elasticsearch/data
    environment:
      - node.name=es02
      - cluster.name=${CLUSTER_NAME:-docker-cluster}
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_hosts=es01,es03
      - xpack.security.enabled=false

  es03:
    <<: *es-node
    container_name: es03
    hostname: es03
    depends_on: [es02]
    volumes:
      - esdata03:/usr/share/elasticsearch/data
    environment:
      - node.name=es03
      - cluster.name=${CLUSTER_NAME:-docker-cluster}
      - cluster.initial_master_nodes=es01,es02,es03
      - discovery.seed_hosts=es01,es02
      - xpack.security.enabled=false

volumes:
  esdata01:
    driver: local
  esdata02:
    driver: local
  esdata03:
    driver: local
