apiVersion: v1
kind: ServiceAccount
metadata:
  name: elasticsearch
  labels: { app.kubernetes.io/name: elasticsearch }
automountServiceAccountToken: true
---
# es-prestop reads the StatefulSet's replicas to tell a scale-down from a restart.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: elasticsearch
  labels: { app.kubernetes.io/name: elasticsearch }
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: elasticsearch
  labels: { app.kubernetes.io/name: elasticsearch }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: elasticsearch
subjects:
  - kind: ServiceAccount
    name: elasticsearch
    namespace: default
