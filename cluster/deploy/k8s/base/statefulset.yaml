apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  labels: { app.kubernetes.io/name: elasticsearch }
spec:
  serviceName: elasticsearch-headless
  replicas: 1
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
      elasticsearch/cluster: elasticsearch
  volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 30Gi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch
        elasticsearch/cluster: elasticsearch
    spec:
      serviceAccountName: elasticsearch
      terminationGracePeriodSeconds: 120
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 1000
        runAsGroup: 0
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: elasticsearch
                    elasticsearch/cluster: elasticsearch
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: elasticsearch
              elasticsearch/cluster: elasticsearch
      containers:
        - name: elasticsearch
          image: elasticsearch-rs
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            runAsNonRoot: true
            runAsUser: 1000
          ports:
            - { name: http, containerPort: 9200, protocol: TCP }
            - { name: transport, containerPort: 9300, protocol: TCP }
          env:
            - name: node.name
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: cluster.name
              value: elasticsearch
            - name: node.roles
              value: master,data,ingest,remote_cluster_client
            - name: network.host
              value: "0.0.0.0"
            - name: network.publish_host
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            - name: discovery.seed_hosts
              value: elasticsearch-headless
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: ES_HEALTH_PARAMS
              value: "wait_for_status=yellow&timeout=1s"
            - name: ES_DRAIN_ON_SHUTDOWN
              value: "true"
            - name: ES_SHUTDOWN_TIMEOUT
              value: "100"
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { memory: 2Gi }
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec:
              command: ["/usr/share/elasticsearch/bin/es-readiness"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/usr/share/elasticsearch/bin/es-prestop"]
          volumeMounts:
            - name: elasticsearch-data
              mountPath: /usr/share/elasticsearch/data
            - name: elasticsearch-logs
              mountPath: /usr/share/elasticsearch/logs
            - name: config
              mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
              subPath: elasticsearch.yml
              readOnly: true
            - name: bootstrap
              mountPath: /usr/share/elasticsearch/settings.d/bootstrap
              readOnly: true
      volumes:
        - name: config
          configMap: { name: elasticsearch-config }
        - name: elasticsearch-logs
          emptyDir: {}
        # cluster.initial_master_nodes for the first bootstrap only; the
        # three-node overlay provides it. Delete the ConfigMap once the
        # cluster has formed (it is optional, pods keep starting without it).
        - name: bootstrap
          configMap:
            name: elasticsearch-bootstrap
            optional: true
