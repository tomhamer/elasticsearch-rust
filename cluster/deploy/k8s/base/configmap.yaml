apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticsearch-config
  labels: { app.kubernetes.io/name: elasticsearch }
data:
  # Extra elasticsearch.yml settings. cluster.name, node.name, node.roles,
  # network.* and discovery.* are set through the environment in
  # statefulset.yaml (environment variables override this file).
  elasticsearch.yml: |
    action.destructive_requires_name: true
    # Security on (as ES 8/9 and Elastic's chart): authentication, HTTPS and
    # transport TLS with the certificates of the `elasticsearch-certs` Secret
    # (create it, and `elasticsearch-credentials`, with ../create-secrets.sh
    # before applying an overlay).
    xpack.security.enabled: true
    xpack.security.http.ssl.enabled: true
    xpack.security.http.ssl.key: certs/tls.key
    xpack.security.http.ssl.certificate: certs/tls.crt
    xpack.security.http.ssl.certificate_authorities: certs/ca.crt
    xpack.security.transport.ssl.enabled: true
    xpack.security.transport.ssl.verification_mode: certificate
    xpack.security.transport.ssl.key: certs/tls.key
    xpack.security.transport.ssl.certificate: certs/tls.crt
    xpack.security.transport.ssl.certificate_authorities: certs/ca.crt
