# Client Service: HTTP (and transport) to ready pods.
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels: { app.kubernetes.io/name: elasticsearch }
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: elasticsearch
    elasticsearch/cluster: elasticsearch
  ports:
    - { name: http, port: 9200, targetPort: http }
    - { name: transport, port: 9300, targetPort: transport }
---
# Headless governing Service: stable pod DNS + discovery seed (every pod,
# ready or not).
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-headless
  labels: { app.kubernetes.io/name: elasticsearch }
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: elasticsearch
    elasticsearch/cluster: elasticsearch
  ports:
    - { name: http, port: 9200, targetPort: http }
    - { name: transport, port: 9300, targetPort: transport }
