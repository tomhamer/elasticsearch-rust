# Three master-eligible data nodes.
#   kubectl apply -k cluster/deploy/k8s/overlays/three-node
# After `GET _cluster/health` answers, remove bootstrap-configmap.yaml from
# `resources` and `kubectl delete configmap -n elasticsearch elasticsearch-bootstrap`
# (cluster.initial_master_nodes must not stay set on a formed cluster).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: elasticsearch
resources:
  - namespace.yaml
  - ../../base
  - bootstrap-configmap.yaml
patches:
  - path: statefulset-patch.yaml
