# kind cluster for the elasticsearch e2e test: 1 control plane + 3 workers,
# one per (simulated) availability zone.
#   kind create cluster --name es-e2e --config cluster/deploy/k8s/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-a
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-b
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-c
